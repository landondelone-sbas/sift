<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sift — Beanie Triage</title>
<meta name="description" content="Fast physical triage for a large Beanie Baby collection. Flags the few items worth researching; never quotes a price.">
<meta name="theme-color" content="#070B2E">

<!-- Every path below is relative. GitHub Pages serves project sites from
     /repo-name/, so a leading slash would break all of them. -->
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sift">

<script src="./data.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>

<div id="field" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<div class="shell">
  <header>
    <div class="mark"><b>Sift</b><span>BEANIE TRIAGE</span></div>
    <div class="seq" id="seqlabel">#1</div>
    <button class="ghost" id="undo" disabled>Undo</button>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-sort" aria-selected="true">SORT</button>
    <button role="tab" id="tab-review" aria-selected="false">REVIEW</button>
    <button role="tab" id="tab-guide" aria-selected="false">GUIDE</button>
    <button role="tab" id="tab-data" aria-selected="false">DATA</button>
  </nav>

  <main>
    <div id="storagewarn" class="warnbar" hidden>Browser storage is blocked here. Nothing is being saved — export before you close this tab.</div>
    <noscript><div class="warnbar">This tool needs JavaScript. Nothing is sent anywhere — it all runs in your browser.</div></noscript>
    <section class="view" id="view-sort"></section>
    <section class="view" id="view-review" hidden></section>
    <section class="view" id="view-guide" hidden></section>
    <section class="view" id="view-data" hidden></section>
  </main>
</div>

<div class="rail">
  <div class="rail-in g">
    <div class="cnt c1"><b id="n1">0</b><small>TIER 1</small></div>
    <div class="cnt c2"><b id="n2">0</b><small>TIER 2</small></div>
    <div class="cnt c3"><b id="n3">0</b><small>BULK</small></div>
    <div class="cnt ch"><b id="nh">0</b><small>KEEP</small></div>
  </div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
